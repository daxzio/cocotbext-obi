name: Test cocotbext-obi

on:
  push:
  pull_request:
  schedule:
    - cron: '0 1 * * 0'  # Weekly on Sunday at 1 AM UTC

jobs:
  run_lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip install -e .

      - name: Lint
        run: make lint

      - name: Type check
        run: make mypy

  build_icarus:
    uses: ./.github/workflows/setup_icarus.yml

  test_obi:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.sim }}, cocotb ${{ matrix.cocotb-version }})
    runs-on: ubuntu-latest
    needs: [run_lint, build_icarus]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        sim: [icarus, verilator]
        cocotb-version: ["v1.9.2", "v2.0.1"]

    steps:
      - uses: actions/checkout@v7

      - name: Cache Icarus
        if: matrix.sim == 'icarus'
        uses: actions/cache@v6
        with:
          path: ${{ needs.build_icarus.outputs.cache_dir }}
          key: ${{ needs.build_icarus.outputs.cache_key }}

      - name: Add Icarus to PATH
        if: matrix.sim == 'icarus'
        run: |
          echo "${{ needs.build_icarus.outputs.cache_dir }}/bin" >> $GITHUB_PATH

      - name: Setup Verilator
        if: matrix.sim == 'verilator'
        uses: veryl-lang/setup-verilator@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip install .
          python -m pip uninstall -y cocotb
          python -m pip install --upgrade git+https://github.com/cocotb/cocotb.git@${{ matrix.cocotb-version }}

      - name: Verify installation
        run: |
          python -c "from cocotbext.obi import ObiHost, ObiBus; print('cocotbext-obi imported')"

      - name: Run unit tests
        run: |
          pytest tests/test_format_addr.py -v

      - name: Run tests
        run: |
          unset PYTHONHOME
          make test SIM=${{ matrix.sim }}

      - name: Run tests with cocotbext-interface
        if: matrix.cocotb-version != 'v1.9.2'
        run: |
          pip install cocotbext-interface
          python -m pip uninstall -y cocotb
          python -m pip install --upgrade git+https://github.com/cocotb/cocotb.git@${{ matrix.cocotb-version }}
          make test SIM=${{ matrix.sim }}

  test_obi_master:
    name: Test master (py${{ matrix.python-version }}, ${{ matrix.sim }}, cocotb master)
    runs-on: ubuntu-latest
    needs: [run_lint, build_icarus]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        sim: [icarus, verilator]
        cocotb-version: ["master"]

    env:
      # cocotb 2.0.x from requirements.txt refuses 3.14; master is then installed over it
      COCOTB_IGNORE_PYTHON_REQUIRES: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Cache Icarus
        if: matrix.sim == 'icarus'
        uses: actions/cache@v6
        with:
          path: ${{ needs.build_icarus.outputs.cache_dir }}
          key: ${{ needs.build_icarus.outputs.cache_key }}

      - name: Add Icarus to PATH
        if: matrix.sim == 'icarus'
        run: |
          echo "${{ needs.build_icarus.outputs.cache_dir }}/bin" >> $GITHUB_PATH

      - name: Setup Verilator
        if: matrix.sim == 'verilator'
        uses: veryl-lang/setup-verilator@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip install .
          python -m pip uninstall -y cocotb
          python -m pip install --upgrade git+https://github.com/cocotb/cocotb.git@${{ matrix.cocotb-version }}

      - name: Verify installation
        run: |
          python -c "from cocotbext.obi import ObiHost, ObiBus; print('cocotbext-obi imported')"

      - name: Run unit tests
        run: |
          pytest tests/test_format_addr.py -v

      - name: Run tests
        run: |
          unset PYTHONHOME
          make test SIM=${{ matrix.sim }}

      - name: Run tests with cocotbext-interface
        run: |
          pip install cocotbext-interface
          python -m pip uninstall -y cocotb
          python -m pip install --upgrade git+https://github.com/cocotb/cocotb.git@${{ matrix.cocotb-version }}
          make test SIM=${{ matrix.sim }}

  test_summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test_obi, test_obi_master]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test_obi.result }}" == "success" ] && [ "${{ needs.test_obi_master.result }}" == "success" ]; then
            echo "All tests passed!"
            exit 0
          else
            echo "Some tests failed"
            exit 1
          fi

  pypi_release:
    name: PyPI Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: [test_obi]
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
