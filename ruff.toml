# Match flake8 line length in setup.cfg. target-version follows
# python_requires (>=3.10).
line-length = 119
target-version = "py310"

[lint]
ignore = [
    "UP007",  # X | Y                 (3.10+; keep if mixing Union for clarity)
    "UP045",  # X | None              (3.10+)
    "FA100",  # from __future__ import annotations
    "FA102",
]
